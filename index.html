<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">

    <div class="top">
    <h2>MathLab Calculator</h2>

    <div class="mode-container">
        <button class="mode-btn" onclick="toggleMenu()">
            MODE ▼
        </button>

        <div class="mode-menu" id="modeMenu">
            <button> Basic</button>
            <button> Scientific</button>
            <button> Matrix</button>
            <button> Integral</button>
            <button> Derivative</button>
            <button> Statistics</button>
            <button> Converter</button>
        </div>
    </div>
</div>

    <input type="text" class="display" value="0" disabled>

    <div class="buttons">
      <button>AC</button>
      <button>DEL</button>
      <button>%</button>
      <button>÷</button>

      <button>sin</button>
      <button>cos</button>
      <button>tan</button>
      <button>×</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>-</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>+</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>=</button>

      <button>0</button>
      <button>.</button>
      <button>√</button>
      <button>x²</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
